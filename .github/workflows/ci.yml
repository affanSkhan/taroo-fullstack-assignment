name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-api/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix task-api
      - name: Run tests
        run: npm test --prefix task-api
      - name: Run coverage
        run: npm run coverage --prefix task-api
